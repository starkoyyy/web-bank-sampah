
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bank_sampah_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    environment:
      APP_NAME: "${APP_NAME:-Bank Sampah Desa Winduherang}"
      APP_ENV: "${APP_ENV:-production}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_KEY: "${APP_KEY}"
      APP_URL: "${APP_URL:-https://bank-sampah.akucintacysec.online}"
      SESSION_SECURE_COOKIE: "${SESSION_SECURE_COOKIE:-true}"
      DB_CONNECTION: "${DB_CONNECTION:-mysql}"
      DB_HOST: "${DOCKER_DB_HOST:-db}"
      DB_PORT: "${DB_PORT:-3306}"
      DB_DATABASE: "${DB_DATABASE}"
      DB_USERNAME: "${DB_USERNAME}"
      DB_PASSWORD: "${DB_PASSWORD}"
      SESSION_DRIVER: "${SESSION_DRIVER:-file}"
      CACHE_STORE: "${CACHE_STORE:-file}"
      QUEUE_CONNECTION: "${QUEUE_CONNECTION:-sync}"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bank_sampah_network

  db:
    image: mysql:8.0
    container_name: bank_sampah_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-${DB_PASSWORD:-rootpassword}}"
      MYSQL_DATABASE: "${DB_DATABASE}"
      MYSQL_USER: "${DB_USERNAME}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
    ports:
      - "${DOCKER_DB_PORT:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bank_sampah_network

volumes:
  db_data:

networks:
  bank_sampah_network:
    driver: bridge
